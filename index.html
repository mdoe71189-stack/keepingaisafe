<style> 

  /* Pulse animation for MEMES button */ 

  @keyframes pulse { 

    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); } 

    50% { transform: scale(1.05); box-shadow: 0 0 15px 10px rgba(250, 204, 21, 0.3); } 

    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); } 

  } 

  .memes-button { 

    background-color: #facc15; /* yellow-400 */ 

    color: black; 

    padding: 0.4rem 0.9rem; 

    border-radius: 0.5rem; 

    font-weight: 600; 

    box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7); 

    animation: pulse 2s infinite; 

    transition: background-color 0.2s ease, transform 0.2s ease; 

  } 

  .memes-button:hover { 

    background-color: #fde047; /* yellow-300 */ 

    transform: scale(1.08); 

    animation: none; /* stops pulsing on hover for click precision */ 

  } 

</style>
